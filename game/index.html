<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merpati Express — Island Hopper</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c2036; }
  #game { display: block; width: 100vw; height: 100vh; object-fit: contain; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Merpati Express Island Hopper: fly a small prop plane between islands, through glowing rings, and land on the next runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
